name: Build

# Builds the automation framework and runs the unit tests on every push.
# Device tests (@Tag("android")) need a phone with the game, so CI excludes them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B verify -DexcludedGroups=android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: automation/target/allure-results
          retention-days: 14
