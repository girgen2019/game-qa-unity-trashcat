# AltTester connection. Every value can be overridden with -D<key>=<value>, e.g. -Dalttester.port=13001
# With an Android device over USB run first: adb reverse tcp:13000 tcp:13000
alttester.host=127.0.0.1
alttester.port=13000
alttester.appName=__default__
alttester.connectTimeoutSec=60
alttester.enableLogging=false

# Default timeout for waiting for game objects, seconds
wait.timeoutSec=20
