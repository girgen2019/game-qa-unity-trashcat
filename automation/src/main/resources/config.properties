# AltTester connection. Every value can be overridden with -D<key>=<value>, e.g. -Dalttester.port=13001
# With an Android device over USB run first: adb reverse tcp:13000 tcp:13000
alttester.host=127.0.0.1
alttester.port=13000
alttester.appName=__default__
alttester.connectTimeoutSec=60
alttester.enableLogging=false

# Default timeout for waiting for game objects, seconds
wait.timeoutSec=20

# Android device smoke tests (ADB only, no AltTester needed)
# "adb" works if platform-tools is on PATH, otherwise give the full path, e.g.
# -Dadb.path=C:\Users\<you>\AppData\Local\Android\Sdk\platform-tools\adb.exe
adb.path=adb
android.package=com.unity.trashdash
# How long to wait for the game to come to the foreground after launch
android.launchTimeoutSec=30
# How long the game must keep running without a crash
android.stabilitySec=30

# Performance thresholds (PERF-01, PERF-02). Measured on the Redmi A5: cold start ~0.7 s, ~370 MB PSS
android.maxColdStartMs=5000
android.maxMemoryMb=600
